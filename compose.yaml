services:
  # Production build served by nginx: http://localhost:8080
  # nginx forwards /api requests to the api service
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Express backend: http://localhost:3000/api/health
  api:
    build: ./server
    environment:
      MONGODB_URI: mongodb://mongo:27017/portfolio
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    restart: unless-stopped

  # MongoDB, also reachable from your Mac at mongodb://localhost:27017
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Dev server with hot reload: http://localhost:5173
  # Start with: docker compose --profile dev up dev api mongo
  dev:
    image: node:24-alpine
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep the container's Linux node_modules separate from your Mac's
      - node_modules:/app/node_modules

volumes:
  node_modules:
  mongo_data:
